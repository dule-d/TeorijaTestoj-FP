<!doctype html>
<html lang="mk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="assets/images/white dk logo.png" />
    <title>Теорија за возачка</title>
    <link rel="stylesheet" href="assets/css/styles.css" />
  </head>
  <body>
    <header class="header">
      <nav class="navbar" aria-label="Главна навигација">
        <a class="navbar-back" href="index.html" aria-label="Назад на почетна">
          <span aria-hidden="true">&larr;</span>
          <span>Назад</span>
        </a>
        <h1>DK - Бесплатно знаење за сите ❤️</h1>
        <div class="navbar-theme">
          <button class="theme-button" id="themeToggle" type="button" aria-label="Промени тема">
            <span class="theme-icon" aria-hidden="true"></span>
            <span class="theme-name"></span>
          </button>
        </div>
      </nav>
    </header>
    <div class="container">
      <div class="filters">
        <label>Категории:</label>
        <button class="cat-btn active-all" data-cat="__all">Сите</button>
        <button class="cat-btn" data-cat="А">А</button>
        <button class="cat-btn" data-cat="A1">A1</button>
        <button class="cat-btn" data-cat="Б">Б</button>
        <button class="cat-btn" data-cat="М">М</button>
        <button class="cat-btn" data-cat="Ф">Ф</button>
        <button class="cat-btn" data-cat="Г">Г</button>
        <button class="cat-btn" data-cat="Ц">Ц</button>
        <button class="cat-btn" data-cat="Ц1">Ц1</button>
        <button class="cat-btn" data-cat="Д">Д</button>
        <button class="cat-btn" data-cat="Д1">Д1</button>
        <div class="toggle-group">
          <label><input type="checkbox" id="showCorrect" /> Прикажи точни одговори</label>
          <button class="clear-btn" id="clearAll">Избриши одговори</button>
        </div>
      </div>
      <div class="stats" id="statsBar"></div>
      <div id="questionsContainer"></div>
    </div>
    <footer class="site-footer">
      <div class="footer-logo">
        <img src="assets/images/white dk logo.png" alt="DK" />
      </div>
      <p class="footer-message">Бесплатно знаење за сите БЕЗ ДА СЕ ПЛАЌА</p>
      <a class="footer-github" href="https://github.com/dule-d" target="_blank" rel="noopener noreferrer">
        <img src="assets/images/github-logo.png" alt="" />
        <span>GitHub</span>
      </a>
    </footer>
    <div class="lightbox" id="lightbox" onclick="closeLightbox()">
      <span class="close">&times;</span><img id="lightboxImg" alt="" />
    </div>
    <script src="assets/js/site.js" defer></script>
    <script src="assets/js/app.js" defer></script>
  </body>
</html>
